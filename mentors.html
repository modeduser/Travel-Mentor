<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find a Mentor - Travel Mentor</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/design-system.css">
    <style>
      .mentors-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 2rem;
        margin-top: 2rem;
      }
      .mentor-card {
        padding: 2rem;
        border-radius: 10px;
        transition: transform 0.3s ease;
      }
      .mentor-card:hover {
        transform: translateY(-5px);
      }
      .mentor-avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background-color: var(--color-text-muted);
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar glass">
      <div class="container nav-content">
        <a href="/" class="logo">Travel Mentor</a>
        <div class="nav-links">
          <a href="/mentors.html" class="nav-link" style="color: var(--color-primary);">Find a Mentor</a>
          <a href="/safety-toolkit.html" class="nav-link">Safety Toolkit</a>
          <a href="/dashboard.html" class="nav-link">Dashboard</a>
          <button class="btn btn-primary">Sign In</button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container" style="padding-top: 120px; min-height: 100vh;">
      <h2>Meet Our Verified Mentors</h2>
      <p style="color: var(--color-text-muted);">Connect with locals and experienced travelers.</p>
      
      <div class="mentors-grid">
        <div class="mentor-card glass">
          <div class="mentor-avatar"></div>
          <h3>Sarah Jenkins</h3>
          <p style="color: var(--color-primary); margin-bottom: 1rem;">Expert in Tokyo, Japan</p>
          <p>Languages: English, Japanese</p>
          <button class="btn btn-secondary" style="margin-top: 1rem; width: 100%;">View Profile</button>
        </div>
        
        <div class="mentor-card glass">
          <div class="mentor-avatar"></div>
          <h3>Carlos Mendoza</h3>
          <p style="color: var(--color-primary); margin-bottom: 1rem;">Local in Barcelona, Spain</p>
          <p>Languages: Spanish, English</p>
          <button class="btn btn-secondary" style="margin-top: 1rem; width: 100%;">View Profile</button>
        </div>
      </div>
    </main>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
