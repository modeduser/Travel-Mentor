<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Travel Mentor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/design-system.css">
    <style>
      .dashboard-grid {
        display: grid;
        grid-template-columns: 250px 1fr;
        gap: 2rem;
        margin-top: 2rem;
      }
      .sidebar {
        padding: 2rem;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .sidebar a {
        padding: 0.5rem;
        border-radius: 5px;
        transition: background 0.3s;
      }
      .sidebar a:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .main-panel {
        padding: 2rem;
        border-radius: 10px;
      }
      .stat-card {
        padding: 1.5rem;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar glass">
      <div class="container nav-content">
        <a href="/" class="logo">Travel Mentor</a>
        <div class="nav-links">
          <a href="/mentors.html" class="nav-link">Find a Mentor</a>
          <a href="/safety-toolkit.html" class="nav-link">Safety Toolkit</a>
          <a href="/dashboard.html" class="nav-link" style="color: var(--color-primary);">Dashboard</a>
          <button class="btn btn-secondary">Profile</button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container" style="padding-top: 120px; min-height: 100vh;">
      <h2>Welcome Back, Traveler!</h2>
      
      <div class="dashboard-grid">
        <aside class="sidebar glass">
          <h3 style="margin-bottom: 1rem;">Menu</h3>
          <a href="#">My Trips</a>
          <a href="#">My Mentors</a>
          <a href="#">Messages</a>
          <a href="#">Settings</a>
        </aside>
        
        <section class="main-panel glass">
          <h3>Upcoming Trip</h3>
          <div class="stat-card" style="margin-top: 1rem;">
            <h4 style="color: var(--color-primary);">Kyoto, Japan</h4>
            <p>Starts in 14 days</p>
            <p style="color: var(--color-text-muted); font-size: 0.9rem;">Mentor: Sarah Jenkins</p>
          </div>
          
          <h3>Recent Messages</h3>
          <div class="stat-card">
            <p><strong>Sarah:</strong> Make sure to download the offline map for Arashiyama!</p>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
